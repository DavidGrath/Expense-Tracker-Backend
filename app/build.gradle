spotless {
    java {
        removeUnusedImports()
        googleJavaFormat()
    }
}

//tasks.named('compileJava') {
//    dependsOn spotlessApply
//}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    dependsOn("openApiGenerate")
//
}
tasks.withType(JavaCompile).configureEach {

    dependsOn("openApiGenerate")
}

tasks.named("openApiGenerate") {
    configFile = "${rootDir}/openapi/config-spring.json"
    generatorName = "spring"
    inputSpec = "${rootDir}/openapi/openapi.json"
    outputDir = "${layout.buildDirectory.getAsFile().get()}/generated/openapi/main"
    // Mainly to use codepoint length
    // https://github.com/OpenAPITools/openapi-generator/blob/a9f439f1c62a3b90a12a05f1b1ecdacfebbc80d3/modules/openapi-generator/src/main/resources/JavaSpring/beanValidationCore.mustache
    templateDir = "${rootDir}/openapi/templates"
    typeMappings = ["file": "Resource"]
    importMappings = ["Nullable": "org.jspecify.annotations.Nullable", "Resource":"org.springframework.core.io.Resource"]
}
compileKotlin {
    kotlinOptions {
        jvmTarget = "17"
    }
}
compileTestKotlin {
    kotlinOptions {
        jvmTarget = "17"
    }
}