}


tasks.register('setUpTestDb') {
    exec {
        commandLine "mysql.exe", "-u", "expense_tracker", "-ppassword", "-e", "DROP DATABASE IF EXISTS `expense_tracker_database_testlocal`;"
    }
    exec {
        commandLine "mysql.exe", "-u", "expense_tracker", "-ppassword", "-e", "CREATE DATABASE `expense_tracker_database_testlocal`;"
    }
    exec {
        workingDir "${rootDir}/database/flyway"
        if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
            commandLine "flyway.cmd", "migrate", "-environment=testlocal"
        } else {
            commandLine "flyway", "migrate", "-environment=testlocal"
        }
    }
}

tasks.register('setUpCIDb') {
    exec {
        commandLine "mysql", "-u", "expense_tracker_dev", "-h", "172.26.48.26", "-p${System.getenv("MYSQL_CREDS_PSW")}", "-e", "DROP DATABASE IF EXISTS `expense_tracker_database_ci`;"
    }
    exec {
        commandLine "mysql", "-u", "expense_tracker_dev", "-h", "172.26.48.26", "-p${System.getenv("MYSQL_CREDS_PSW")}", "-e", "CREATE DATABASE `expense_tracker_database_ci`;"
    }

