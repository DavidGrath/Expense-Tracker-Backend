- name: Set up Expense Tracker
  hosts: test_server,staging_server,prod_server
  tasks:
    - name: Ensure OTel Directory exists
      become: true
      ansible.builtin.file:
        path: /opt/opentelemetry
        state: directory
    - name: Download file
      become: true
      ansible.builtin.get_url:
        url: https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.9.0/opentelemetry-javaagent.jar
        dest: /opt/opentelemetry/opentelemetry-javaagent.jar
        checksum: sha256:FA039F86082B559E53283A863E03DE5DF7DB4BDB4840C5CBB8BF38F292987D5B
    - name: Ensure Backend Directory exists
      become: true
      ansible.builtin.file:
        path: /opt/expense_tracker
        state: directory
        #owner: TODO create expense-tracker
#        mode: '760' TODO Rework users later
        mode: '777'
    - name: Download Pyroscope OTel Jar
      become: true
      ansible.builtin.get_url:
        url: https://github.com/grafana/otel-profiling-java/releases/download/v1.0.4/pyroscope-otel.jar
        dest: /opt/expense_tracker/pyroscope-otel.jar
        checksum: sha256:39058f217186a1ac192a0c31e9ae3fed5d49d0ec6be6baca882bdbcc8d19c512
    - name: Configure Service Startup
      become: true
      ansible.builtin.template:
        src: expense_tracker_service.sh.j2
        dest: /opt/expense_tracker/startup.sh
        #owner: TODO create expense-tracker
        mode: '751'
    - name: Configure Service
      become: true
      ansible.builtin.template:
        src: expense_tracker_backend.service.j2
        dest: /etc/systemd/system/expense_tracker_backend.service
